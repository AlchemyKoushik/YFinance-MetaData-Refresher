services:
  ies-metadata-refresh:
    build: .
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
